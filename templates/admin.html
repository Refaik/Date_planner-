<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Панель Парня</title>
  <link rel="stylesheet" href="/static/css/style.css">
  <style>
    body {
      overflow-y: auto !important;
      padding: 20px 10px;
    }
  </style>
</head>
<body>
  <div class="form-card">
    <h2 style="font-size: 20px; font-weight: 800; color: #ff1493; margin-bottom: 15px; text-align: center;">➕ Добавить свидание</h2>
    <form id="adminForm" onsubmit="saveIdea(event)">
      <div class="form-group">
        <label>Название свидания:</label>
        <input type="text" id="title" class="form-control" required placeholder="Например: Поход в планетарий">
      </div>

      <div class="form-group">
        <label>Описание:</label>
        <textarea id="description" class="form-control" rows="3" required placeholder="Подробное описание..."></textarea>
      </div>

      <div class="form-group">
        <label>Локация:</label>
        <select id="location_type" class="form-control">
          <option value="home">Дома 🏠</option>
          <option value="outside">Вне дома 🌆</option>
        </select>
      </div>

      <div class="form-group">
        <label>Погода:</label>
        <select id="weather_type" class="form-control">
          <option value="any">Любая 🌈</option>
          <option value="sunny">Солнечно ☀️</option>
          <option value="indoor">В помещении 🏢</option>
        </select>
      </div>

      <div class="form-group">
        <label>Чек-лист (что купить / подготовить):</label>
        <textarea id="requirements_text" class="form-control" rows="2" placeholder="1. Купить билеты&#10;2. Взять цветы"></textarea>
      </div>

      <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
        <input type="checkbox" id="requires_booking" style="width: 18px; height: 18px;">
        <label for="requires_booking" style="margin: 0;">Нужна предварительная бронь</label>
      </div>

      <div class="form-group">
        <label>Обложка (фото):</label>
        <input type="file" id="photo" accept="image/*" class="form-control">
      </div>

      <button type="submit" class="main-button" style="width: 100%; margin-top: 10px;">
        Сохранить идею ✨
      </button>
    </form>
  </div>

  <script>
    async function saveIdea(e) {
      e.preventDefault();
      const formData = new FormData();
      formData.append('title', document.getElementById('title').value);
      formData.append('description', document.getElementById('description').value);
      formData.append('location_type', document.getElementById('location_type').value);
      formData.append('weather_type', document.getElementById('weather_type').value);
      formData.append('requirements_text', document.getElementById('requirements_text').value);
      formData.append('requires_booking', document.getElementById('requires_booking').checked);

      const photo = document.getElementById('photo').files[0];
      if (photo) formData.append('photo', photo);

      const res = await fetch('/api/admin/ideas', { method: 'POST', body: formData });
      if (res.ok) {
        alert("Идея успешно добавлена!");
        location.reload();
      }
    }
  </script>
</body>
</html>
